name: Generate Collective Subject Book

on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Subject slug'
        required: true
      jobId:
        description: 'The MongoDB document ID tracking this build job (carries the selected units)'
        required: true

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    # Needed so the run's own auto-issued GITHUB_TOKEN (passed in below) can create/upload to
    # the draft release the combined book is stored on — no separate PAT secret required.
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Install poppler-utils (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Compile and Upload Combined PDF
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # The run's own short-lived token (not the Render backend's GITHUB_PAT, which only
          # exists on Render and is never available inside an Actions run) — scoped to this
          # run, sufficient to create a release/upload an asset given contents:write above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generateCollectiveSubjectBookPdf.js \
            --subject "${{ github.event.inputs.subject }}" \
            --jobId "${{ github.event.inputs.jobId }}"
